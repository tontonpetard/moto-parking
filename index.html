<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="mobile-web-app-capable" content="yes">
<title>Moto Parking Tokyo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#14171c;--panel:#1d2128;--ink:#eef0f3;--mute:#9aa3ae;--acc:#ffb000;--me:#3fa7ff;--line:#2c323b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select,button{font:inherit;color:var(--ink);background:#2a3039;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 10px}
button.pri{background:var(--acc);color:#111;border:0;font-weight:600}
#map{flex:1 1 55%;min-height:200px}
#status{padding:6px 12px;font-size:13px;color:var(--mute);background:var(--panel);border-top:1px solid var(--line)}
#list{flex:1 1 45%;overflow-y:auto;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.item{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.item.sel{background:#262b33}
.dist{min-width:62px;text-align:right;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.info{flex:1;min-width:0;cursor:pointer}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--mute)}
.go{display:inline-flex;align-items:center;justify-content:center;min-width:52px;min-height:40px;border-radius:10px;background:#2a3039;color:var(--ink);text-decoration:none;font-size:13px;border:1px solid var(--line)}
.empty{padding:20px;color:var(--mute);text-align:center}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);border:2px solid #111;box-shadow:0 1px 4px #0008}
.pin.free{background:#45d483}.pin.big{outline:3px solid #fff5}
.me{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 6px #3fa7ff44}
.leaflet-popup-content{font-size:14px}
.leaflet-popup-content a{color:#0a66c2}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏍 Moto parking</h1>
    <select id="radius" aria-label="Search radius">
      <option value="500">500 m</option>
      <option value="1000" selected>1 km</option>
      <option value="2000">2 km</option>
      <option value="4000">4 km</option>
    </select>
